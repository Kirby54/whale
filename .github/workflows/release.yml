# Builds the Windows installer and publishes it in a GitHub Release.
# Runs when a version tag is pushed, for example:  git tag v0.5.0 && git push origin v0.5.0
# The release notes come from docs/releases/<tag>.md when that file exists.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then body="$(cat "$f")"; else body="See the README for what's new."; fi
          { echo 'body<<END_OF_NOTES'; echo "$body"; echo 'END_OF_NOTES'; } >> "$GITHUB_OUTPUT"

      - name: Build the installer and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Whale ${{ github.ref_name }}
          releaseBody: |
            Download **Whale_*_x64-setup.exe** below and run it. No admin rights needed.

            Windows may show "Windows protected your PC" because the installer is not code-signed yet: click **More info → Run anyway**.

            ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
