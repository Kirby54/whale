<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="titlebar" data-tauri-drag-region>
  <div class="tb-title" data-tauri-drag-region>
    <img class="tb-logo" data-logo src="img/logo-a.svg" alt="" data-tauri-drag-region>
    <span data-tauri-drag-region>Whale</span>
  </div>
  <div class="tb-btns">
    <button id="winMin" title="Réduire" aria-label="Réduire"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
    <button id="winMax" title="Agrandir" aria-label="Agrandir"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button>
    <button id="winClose" title="Fermer" aria-label="Fermer"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
  </div>
</div>
<div id="app">
  <nav id="nav">
    <div id="brand"><img id="brandLogo" data-logo src="img/logo-a.svg" alt=""><span class="b1">whale</span><span class="b2">journal</span></div>
    <div id="brandbar"></div>
    <button id="openPalette"><span>Chercher</span><kbd>Ctrl K</kbd></button>
    <div class="navlinks">
      <button class="nl" id="btnGraph">Cerveau</button>
      <button class="nl" id="btnNotes">Notes</button>
      <button class="nl" id="btnNew">Écrire</button>
    </div>
    <div class="navlinks">
      <button class="nl" id="btnImport">Ajouter</button>
      <button class="nl" id="btnMore">Plus</button>
    </div>
    <div id="more" class="hide">
      <button class="mi" id="btnAsk">Demander à l'IA</button>
      <button class="mi" id="btnDash">Tableau de bord</button>
      <button class="mi" id="btnTimeline">Timeline</button>
      <button class="mi" id="btnTable">Tableau des trades</button>
      <div class="msep"></div>
      <button class="mi" id="btnSettings">Réglages de l'IA</button>
      <button class="mi" id="btnLogo">Choisir le logo</button>
      <button class="mi" id="btnVault">Changer de coffre</button>
    </div>
    <div style="flex:1"></div>
    <div id="status"></div>
    <div id="aistatus">AUCUNE IA EN COURS</div>
  </nav>

  <aside id="side">
    <div id="sidehead"><span id="vault" title=""></span></div>
    <input id="search" placeholder="Filtrer les notes…" autocomplete="off">
    <div id="tree"></div>
  </aside>

  <main id="main">
    <div id="tabbar">
      <div id="crumb"></div>
      <button class="tbtn ai" id="btnClassify" title="L'IA remplit le type, les tags, les propriétés et les liens">✦ Classer avec l'IA</button>
      <button class="tbtn" id="btnMode" title="Ctrl+E">Édition</button>
      <button class="tbtn" id="btnDel" title="Déplacer dans la corbeille du coffre">Supprimer</button>
    </div>
    <div id="views">
      <section class="view on" id="noteview">
        <div id="notecol">
          <input id="title" spellcheck="false">
          <div id="reader"></div>
          <div id="editorhost"></div>
        </div>
      </section>
      <section class="view" id="graphview">
        <canvas id="gcanvas"></canvas>
        <div id="gtip"></div>
        <div id="glegend"></div>
        <button id="apOpen" class="hide">✦ Ton IA</button>
        <div id="ghistwrap"><canvas id="ghist"></canvas><div id="ghistlabel"></div></div>
      </section>
      <section class="view" id="dashview"><div id="dash"></div></section>
      <section class="view scrollv" id="timelineview"><div class="page" id="timeline"></div></section>
      <section class="view scrollv" id="tableview"><div class="page wide" id="tradetable"></div></section>
      <section class="view" id="askview">
        <div id="askcol">
          <div id="chat"></div>
          <form id="askform">
            <textarea id="askinput" rows="1" placeholder="Pose une question à ton journal… ex. « Pourquoi je perds sur TSLA ? »"></textarea>
            <button class="tbtn ai" id="asksend" type="submit">Envoyer</button>
          </form>
          <div id="askhint"></div>
        </div>
      </section>
    </div>
  </main>

  <aside id="aipanel" class="hide">
    <div class="aph"><span>Ton IA</span><button id="apClose" title="Fermer" aria-label="Fermer le panneau">×</button></div>
    <div id="apchat"></div>
    <form id="apform">
      <textarea id="apinput" rows="1" placeholder="Demande à ton journal…"></textarea>
      <button id="apsend" type="submit" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </aside>

  <aside id="right">
    <div class="rh"><span>Rétroliens</span><span id="blc"></span></div>
    <div id="backlinks"></div>
    <div class="rh" style="margin-top:18px"><span>Liens sortants</span><span id="olc"></span></div>
    <div id="outlinks"></div>
  </aside>
</div>
<div id="palette" class="modal hide">
  <div class="pbox">
    <input id="pinput" placeholder="Cherche une note, ou pose une question…" autocomplete="off" spellcheck="false">
    <div id="presults"></div>
  </div>
</div>
<div id="modal" class="modal hide"><div class="mbox" id="mbox"></div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/editor.bundle.js"></script>
<script src="core.js"></script>
<script src="seed.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
<script src="graph.js"></script>
<script src="ai.js"></script>
<script src="import.js"></script>
<script src="views.js"></script>
<script src="aipanel.js"></script>
<script src="ui.js"></script>
</body>
</html>
